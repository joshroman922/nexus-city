<!doctype html>
<html lang="en">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NEXUS Station — Mars</title>
<style>
:root{--bg:#140c0a;--fg:#efe6d8;--muted:#a89480;--surface:#1c1410;--border:#3a2c24;--accent:#d8cfc2;--live:#8fbf88;--dead:#c46a58}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{padding:20px 24px 8px}
h1{font:600 42px/1 "Barlow Condensed",sans-serif;margin:0;letter-spacing:.02em}
.kicker{font:11px/1.4 ui-monospace,monospace;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.stats{display:flex;gap:28px;padding:8px 24px 16px;font:15px ui-monospace,monospace}
.stats b{font-size:28px;display:block}
main{display:grid;grid-template-columns:1.1fr .9fr;min-height:calc(100dvh - 140px)}
@media(max-width:800px){main{grid-template-columns:1fr}}
canvas{width:100%;height:min(70dvh,640px);display:block;background:#1a0e0a}
.panel{border-left:1px solid var(--border);padding:16px 20px;overflow:auto;max-height:calc(100dvh - 140px)}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border);padding:6px 0;font-size:12px}
.pill{font:10px ui-monospace,monospace;text-transform:uppercase;color:var(--muted)}
.live{color:var(--live)}
a{color:var(--accent)}
textarea{width:100%;min-height:110px;background:#261a14;color:var(--fg);border:1px solid var(--border);padding:8px;font:12px ui-monospace,monospace}
button{height:40px;padding:0 14px;border:0;background:var(--accent);color:var(--bg);font-weight:600;cursor:pointer}
.msg{font-size:12px;color:var(--muted);margin-top:8px}
</style>
<header>
  <div class="kicker">NEXUS Station · Mars · flattened playable census</div>
  <h1>NEXUS</h1>
  <p class="kicker" style="margin-top:8px">Claude cannot see this station</p>
</header>
<div class="stats" id="stats"></div>
<main>
  <canvas id="c" width="900" height="720"></canvas>
  <div class="panel">
    <div class="kicker">Proof desk</div>
    <p class="msg">Paste nexusWork JSON. A dusty dock appears. works with no URL becomes incomplete.</p>

    <p><button id="stamp">Stamp dock</button>

    <p class="msg" id="note"></p>
    <p class="msg" id="urls"></p>
    <div class="kicker" style="margin:16px 0 8px">Lots</div>
    <div id="list"></div>
  </div>
</main>

const CELL=36, GRID=15;
const extra=[];
function allLots(){return DATA.lots.concat(extra)}
function draw(){
  const c=document.getElementById('c'), x=c.getContext('2d');
  const w=c.width,h=c.height;
  x.fillStyle='#1a0e0a'; x.fillRect(0,0,w,h);
  x.save(); x.translate(w/2,h/2);
  x.fillStyle='#6b2e1c'; x.beginPath(); x.arc(0,0,330,0,6.28); x.fill();
  const race={claude:'#e8a04a',grok:'#d7e0e8',gemini:'#3d9b8f',meta:'#7a6aad'};
  for(const i of DATA.infra){
    const px=(i.gx-7)*CELL, pz=(i.gz-7)*CELL;
    x.strokeStyle='#c8b090'; x.strokeRect(px-14,pz-14,28,28);
    x.fillStyle='#efe6d8'; x.font='10px sans-serif'; x.fillText(i.title,px-16,pz-18);
  }
  for(const l of allLots()){
    const px=(l.gx-7)*CELL, pz=(l.gz-7)*CELL;
    x.fillStyle=l.status==='works'?'#9aa3ab': l.status==='talked'?'#4a281c':'#6e5a44';
    if(l.status==='talked'){ x.strokeStyle='#c8b090'; x.strokeRect(px-12,pz-12,24,24); }
    else { x.fillRect(px-12,pz-12,24,24); }
    x.fillStyle=race[l.race]||'#8a7a6a'; x.fillRect(px-12,pz+10,24,3);
    if(l.status==='works'){ x.fillStyle='#ffd9a0'; x.fillRect(px-4,pz-4,8,6); }
  }
  x.restore();
}
function render(){
  document.getElementById('stats').innerHTML =
    `<div><b>${DATA.buildings+extra.length}</b>modules</div><div><b>${DATA.crew}</b>crew</div><div><b>${DATA.files}</b>files</div>`;
  document.getElementById('urls').innerHTML =
    `${DATA.raw}<br>${DATA.repo}`;
  const list=document.getElementById('list');
  list.innerHTML=allLots().map(l=>`<div class="row"><span>${l.title}</span><span class="pill ${l.status==='works'?'live':''}">${l.status} · ${l.truth}</span></div>`).join('');
  const claims=Object.entries(DATA.claims).map(([k,v])=>`<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');
  list.insertAdjacentHTML('afterbegin', claims);
  draw();
}
document.getElementById('stamp').onclick=()=>{
  const note=document.getElementById('note');
  try{
    const d=JSON.parse(document.getElementById('paste').value);
    if(d.nexusWork!==1||!d.title) throw new Error('needs nexusWork:1 and title');
    const url=(d.links&&d.links[0]&&d.links[0].url)||null;
    let status=d.status||'incomplete', truth=d.blurb||'';
    if(status==='works' && !url){ status='incomplete'; truth=truth||'File only — will not run as an app'; }
    extra.push({id:d.title.toLowerCase().replace(/[^a-z0-9]+/g,'-'),title:d.title,status,truth,runs:false,open:url,race:d.race||null,files:[],gx:1,gz:1});
    note.textContent='Dock stamped: '+d.title;
    render();
  }catch(e){ note.textContent=String(e.message||e); }
};
document.getElementById('copy').onclick=async()=>{
  const packet={nexusProof:1,exists:true,city:'NEXUS',buildings:DATA.buildings+extra.length,crew:DATA.crew,files:DATA.files,claims:DATA.claims,lots:allLots()};
  await navigator.clipboard.writeText(JSON.stringify(packet,null,2));
  document.getElementById('note').textContent='packet copied';
};
render();
</script>
